name: Daily forward test
on:
  push:
    paths:
      - 'config.json'
      - 'config-broad.json'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/forward-test.yml'
  workflow_dispatch:
  schedule:
    # 01:17 UTC = 04:17 Istanbul; safely after US close in either DST regime.
    - cron: '17 1 * * 2-6'
    # Independent backup triggers; existing origins are immutable/idempotent.
    - cron: '47 3 * * 2-6'
    - cron: '17 6 * * 2-6'
permissions:
  contents: write
concurrency:
  group: forward-test
  cancel-in-progress: false
jobs:
  collect-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: timesfm3-official-checkpoint-v1
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[model]'
      - name: Original pilot — evaluate and forecast
        run: python -m timesfm_stock.cli daily
      - name: Broader study — validate initial data
        if: always()
        run: |
          if [ ! -f results-broad/experiment.json ]; then
            python -m timesfm_stock.cli preflight --config config-broad.json --output results-broad
          fi
      - name: Broader study — evaluate and forecast
        if: always()
        run: python -m timesfm_stock.cli daily --config config-broad.json --output results-broad
      - name: Show report
        if: always()
        run: |
          for study_dir in results results-broad; do
            if [ -f "$study_dir/reports/report.md" ]; then
              printf '\n## %s\n\n' "$study_dir" >> "$GITHUB_STEP_SUMMARY"
              cat "$study_dir/reports/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Persist results
        if: always()
        run: |
          if [ -d results ] || [ -d results-broad ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            for study_dir in results results-broad; do
              if [ -d "$study_dir" ]; then
                git add "$study_dir"
              fi
            done
            if ! git diff --cached --quiet; then
              git commit -m 'Record forward forecasts and realized outcomes [skip ci]'
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forward-test-results
          path: |
            results/
            results-broad/
          if-no-files-found: ignore
          retention-days: 90
